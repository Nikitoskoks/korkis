<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Детектор китов</title>
<style>
  :root { --bg:#04121f; --panel:rgba(4,18,31,.8); --fg:#e6f1ff; --muted:#7f9bb5; --buy:#2ee6a6; --sell:#ff5c7a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui, sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .panel { position:fixed; top:12px; left:12px; right:12px; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center;
           background:var(--panel); padding:10px 14px; border-radius:12px; backdrop-filter:blur(6px); font-size:14px; }
  .panel h1 { font-size:18px; margin:0; }
  select, input { background:#0b2236; color:var(--fg); border:1px solid #1d3a55; border-radius:6px; padding:4px 6px; font-size:14px; }
  input { width:110px; }
  .stat b { font-variant-numeric:tabular-nums; }
  .buy { color:var(--buy); } .sell { color:var(--sell); } .muted { color:var(--muted); }
  .bar { flex:1 1 160px; height:8px; background:var(--sell); border-radius:4px; overflow:hidden; min-width:120px; }
  .bar div { height:100%; width:50%; background:var(--buy); transition:width .4s; }
  .log { position:fixed; bottom:12px; right:12px; width:min(300px, calc(100% - 24px)); max-height:40vh; overflow:hidden;
         background:var(--panel); border-radius:12px; padding:8px 12px; font-size:13px; font-variant-numeric:tabular-nums; }
  .log div { padding:2px 0; display:flex; justify-content:space-between; gap:8px; }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div class="panel">
  <h1>🐋 Детектор китов</h1>
  <label>Пара
    <select id="symbol">
      <option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option>
      <option>XRPUSDT</option><option>DOGEUSDT</option>
    </select>
  </label>
  <label>Кит от $ <input id="min" type="number" value="50000" step="10000" min="1000"></label>
  <span class="stat">Цена: <b id="price">—</b></span>
  <span class="stat buy">Купили: <b id="buyVol">$0</b></span>
  <span class="stat sell">Продали: <b id="sellVol">$0</b></span>
  <div class="bar" title="Доля покупок среди китов"><div id="ratio"></div></div>
  <span id="status" class="muted">подключение…</span>
</div>
<div class="log" id="log"><div class="muted">Ждём китов…</div></div>

<script>
const canvas = document.getElementById("sea");
const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);
let W, H, fish = [], bubbles = [], ws, buyVol = 0, sellVol = 0, logRows = [];

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize); resize();

const fmt = n => n >= 1e6 ? "$" + (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? "$" + (n / 1e3).toFixed(0) + "K" : "$" + n.toFixed(0);

function connect() {
  if (ws) { ws.onclose = null; ws.close(); }
  fish = []; buyVol = sellVol = 0; logRows = []; renderStats(); renderLog();
  const symbol = $("symbol").value;
  $("status").textContent = "подключение…";
  ws = new WebSocket("wss://stream.bybit.com/v5/public/linear");
  ws.onopen = () => {
    $("status").textContent = "онлайн";
    ws.send(JSON.stringify({ op: "subscribe", args: ["publicTrade." + symbol] }));
    ws.ping = setInterval(() => ws.readyState === 1 && ws.send('{"op":"ping"}'), 20000);
  };
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (!msg.topic || !msg.data) return;
    for (const t of msg.data) onTrade(t);
  };
  ws.onclose = () => { clearInterval(ws.ping); $("status").textContent = "переподключение…"; setTimeout(connect, 3000); };
}

function onTrade(t) {
  const price = +t.p, usd = price * +t.v, buy = t.S === "Buy";
  $("price").textContent = price.toLocaleString("ru-RU");
  if (usd < +$("min").value) return;
  buy ? buyVol += usd : sellVol += usd;
  spawnFish(usd, buy);
  logRows.unshift({ usd, buy, time: new Date(+t.T).toLocaleTimeString("ru-RU") });
  logRows.length = Math.min(logRows.length, 15);
  renderStats(); renderLog();
}

function renderStats() {
  $("buyVol").textContent = fmt(buyVol);
  $("sellVol").textContent = fmt(sellVol);
  const total = buyVol + sellVol;
  $("ratio").style.width = (total ? buyVol / total * 100 : 50) + "%";
}

function renderLog() {
  $("log").innerHTML = logRows.length
    ? logRows.map(r => `<div class="${r.buy ? "buy" : "sell"}"><span>${r.buy ? "▲ лонг" : "▼ шорт"}</span><b>${fmt(r.usd)}</b><span class="muted">${r.time}</span></div>`).join("")
    : '<div class="muted">Ждём китов…</div>';
}

function spawnFish(usd, buy) {
  const min = +$("min").value;
  const size = Math.min(14 + Math.sqrt(usd / min) * 14, 140);
  const dir = Math.random() < .5 ? 1 : -1;
  fish.push({
    x: dir > 0 ? -size : W + size, y: buy ? H * (.65 + Math.random() * .3) : H * (.1 + Math.random() * .25),
    vx: dir * (1 + Math.random() * 1.5) * (40 / size + .4), vy: (buy ? -1 : 1) * (.3 + Math.random() * .4),
    size, buy, label: fmt(usd), phase: Math.random() * 6, life: 0,
  });
}

function drawFish(f) {
  const s = f.size, color = f.buy ? "#2ee6a6" : "#ff5c7a", d = Math.sign(f.vx);
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(d, 1);
  const wag = Math.sin(f.phase) * s * .15;
  ctx.fillStyle = color;
  ctx.globalAlpha = Math.min(1, f.life / 20);
  ctx.beginPath(); // хвост
  ctx.moveTo(-s * .8, 0);
  ctx.lineTo(-s * 1.3, -s * .4 + wag);
  ctx.lineTo(-s * 1.3, s * .4 + wag);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); // тело
  ctx.ellipse(0, 0, s, s * .5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#04121f"; // глаз
  ctx.beginPath(); ctx.arc(s * .55, -s * .12, Math.max(2, s * .07), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  if (s > 30) {
    ctx.fillStyle = "#04121f";
    ctx.font = `bold ${Math.min(s * .32, 26)}px system-ui`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(f.label, f.x, f.y + s * .08);
  }
}

function frame() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0a2a45"); g.addColorStop(1, "#020a12");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if (Math.random() < .3) bubbles.push({ x: Math.random() * W, y: H + 5, r: 1 + Math.random() * 3 });
  ctx.fillStyle = "rgba(160,210,255,.25)";
  bubbles = bubbles.filter(b => (b.y -= .6 + b.r * .3) > -5);
  for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); }

  fish = fish.filter(f => f.x > -f.size * 2 && f.x < W + f.size * 2 && f.y > -f.size && f.y < H + f.size);
  for (const f of fish) {
    f.x += f.vx; f.y += f.vy + Math.sin(f.phase) * .3; f.phase += .15; f.life++;
    drawFish(f);
  }
  requestAnimationFrame(frame);
}

$("symbol").onchange = connect;
$("min").onchange = () => { fish = []; buyVol = sellVol = 0; logRows = []; renderStats(); renderLog(); };
connect();
frame();
</script>
</body>
</html>
