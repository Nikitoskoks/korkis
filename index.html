<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Битва лонгов и шортов</title>
<style>
  :root { --bg:#1a2435; --panel:rgba(10,16,28,.82); --fg:#e8eef7; --muted:#8aa0b8; --bull:#2ee6a6; --bear:#ff5c7a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .panel { position:fixed; top:10px; left:10px; right:10px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center;
           background:var(--panel); padding:8px 14px; border-radius:12px; backdrop-filter:blur(6px); font-size:14px; }
  .panel h1 { font-size:16px; margin:0; }
  select, input { background:#0b1322; color:var(--fg); border:1px solid #27354b; border-radius:6px; padding:4px 6px; font-size:14px; }
  input { width:90px; }
  .bull { color:var(--bull); } .bear { color:var(--bear); }
  .tug { position:fixed; left:50%; top:52px; transform:translateX(-50%); width:min(560px,calc(100% - 20px));
         background:var(--panel); border-radius:10px; padding:6px 12px 8px; text-align:center; }
  .tug .who { font-weight:800; font-size:16px; margin-bottom:4px; }
  .tug .row { display:flex; align-items:center; gap:8px; font-weight:800; font-size:18px; font-variant-numeric:tabular-nums; }
  .rope { position:relative; flex:1; height:12px; border-radius:6px; background:var(--bear); overflow:hidden; }
  .rope .fill { position:absolute; inset:0 auto 0 0; width:50%; background:var(--bull); transition:width .5s; }
  .rope .mid { position:absolute; top:0; bottom:0; left:50%; width:1px; background:rgba(0,0,0,.5); }
  #status { font-size:13px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h1>⚔️ Битва лонгов и шортов</h1>
  <label>Пара
    <select id="symbol"><option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option><option>XRPUSDT</option><option>DOGEUSDT</option></select>
  </label>
  <label>Крупная сделка от $ <input id="big" type="number" value="100000" step="10000"></label>
  <span>Цена: <b id="price">—</b></span>
  <span class="bull">🟢 <b id="bc">0</b></span>
  <span class="bear"><b id="rc">0</b> 🔴</span>
  <span id="status" class="muted">подключение…</span>
</div>
<div class="tug">
  <div class="who" id="who">⚖️ Равновесие</div>
  <div class="row"><span class="bull">🐂<span id="bp">50</span>%</span>
    <div class="rope"><div class="fill" id="fill"></div><div class="mid"></div></div>
    <span class="bear"><span id="rp">50</span>%🐻</span></div>
</div>

<script>
const cv = document.getElementById("c"), ctx = cv.getContext("2d"), $ = id => document.getElementById(id);
let W, H, GROUND, units = [], arrows = [], flashes = [], ws, flow = [], tint = .5, kills = { bull: 0, bear: 0 };
let champCd = { bull: 0, bear: 0 };

function resize() { const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d,0,0,d,0,0); GROUND = H - 70; }
addEventListener("resize", resize); resize();
const fmt = n => n >= 1e6 ? "$"+(n/1e6).toFixed(1)+"M" : n >= 1e3 ? "$"+(n/1e3).toFixed(0)+"K" : "$"+n.toFixed(0);

// ---- соединение с Bybit ----
function connect() {
  if (ws) { ws.onclose = null; ws.close(); }
  units = []; arrows = []; flow = []; kills = { bull:0, bear:0 };
  const sym = $("symbol").value; $("status").textContent = "подключение…";
  ws = new WebSocket("wss://stream.bybit.com/v5/public/linear");
  ws.onopen = () => { $("status").textContent = "бой идёт"; ws.send(JSON.stringify({ op:"subscribe", args:["publicTrade."+sym] })); ws.ping = setInterval(()=>ws.readyState===1&&ws.send('{"op":"ping"}'),20000); };
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.topic && m.data) for (const t of m.data) onTrade(t); };
  ws.onclose = () => { clearInterval(ws.ping); $("status").textContent = "переподключение…"; setTimeout(connect,3000); };
}
function onTrade(t) {
  const price = +t.p, usd = price * +t.v, buy = t.S === "Buy";
  $("price").textContent = price.toLocaleString("ru-RU");
  const sec = Math.floor(Date.now()/1000), last = flow[flow.length-1];
  if (last && last[0]===sec) last[buy?1:2] += usd; else flow.push([sec, buy?usd:0, buy?0:usd]);
  // каждая сделка = воин. крупная = сильнее.
  const big = +$("big").value;
  const strong = usd >= big;
  spawnSoldier(buy ? "bull" : "bear", strong, usd);
}

// ---- армии ----
function spawnSoldier(side, strong, usd) {
  if (units.length > 260) return;
  const bull = side === "bull";
  const archer = Math.random() < .35;
  units.push({
    side, bull, archer,
    x: bull ? 60 + Math.random()*90 : W - 60 - Math.random()*90,
    y: GROUND - Math.random()*52,
    hp: strong ? 3 : 1, max: strong ? 3 : 1, strong,
    spd: (archer ? 1.1 : 1.9) + Math.random()*.6,
    cd: Math.random()*40, phase: Math.random()*6, champ: false,
    r: strong ? 11 : 7,
  });
}
function spawnChampion(side) {
  const bull = side === "bull";
  units.push({ side, bull, archer:false, x: bull ? 40 : W-40, y: GROUND,
    hp: 30, max: 30, strong:true, spd: 1.1, cd:0, phase:0, champ:true, r: 20 });
  flashes.push({ x: bull ? 60 : W-60, y: GROUND-70, txt: (bull?"🟢":"🔴")+" БОГАТЫРЬ!", c: bull?"#2ee6a6":"#ff5c7a", life: 90 });
}

function renderTug() {
  const cut = Date.now()/1000 - 60; while (flow.length && flow[0][0] < cut) flow.shift();
  let b=0, s=0; for (const [,x,y] of flow) { b+=x; s+=y; }
  const share = b+s ? b/(b+s) : .5, pct = Math.round(share*100); tint = share;
  $("bp").textContent = pct; $("rp").textContent = 100-pct; $("fill").style.width = pct+"%";
  const who = $("who");
  if (pct>=60){ who.textContent = pct>=75?"🐂🔥 Лонги рвут!":"🐂 Лонги давят!"; who.className="who bull"; }
  else if (pct<=40){ who.textContent = pct<=25?"🐻🔥 Шорты рвут!":"🐻 Шорты давят!"; who.className="who bear"; }
  else { who.textContent = "⚖️ Равновесие"; who.className="who"; }
  // перевес шлёт богатыря
  const now = performance.now();
  if (pct>=66 && now>champCd.bull) { spawnChampion("bull"); champCd.bull = now + 9000; }
  if (pct<=34 && now>champCd.bear) { spawnChampion("bear"); champCd.bear = now + 9000; }
}
setInterval(renderTug, 500);

function nearestEnemy(u) {
  let best=null, bd=Infinity;
  for (const e of units) { if (e.bull===u.bull || e.hp<=0) continue; const d=Math.abs(e.x-u.x); if (d<bd){bd=d;best=e;} }
  return [best, bd];
}

function step() {
  // фон: небо + земля
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#223150"); g.addColorStop(.7,"#2b3c57"); g.addColorStop(.7,"#3a2f26"); g.addColorStop(1,"#241d16");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // подсветка перевеса
  const lean=(tint-.5)*2;
  if (Math.abs(lean)>.1){ ctx.fillStyle = lean>0?`rgba(46,230,166,${lean*.08})`:`rgba(255,92,122,${-lean*.08})`; ctx.fillRect(0,0,W,H); }
  drawCastle(true); drawCastle(false);

  // линия фронта по проценту
  const front = W*tint;
  ctx.strokeStyle="rgba(255,255,255,.08)"; ctx.setLineDash([4,6]); ctx.beginPath(); ctx.moveTo(front,90); ctx.lineTo(front,GROUND); ctx.stroke(); ctx.setLineDash([]);

  // юниты
  for (const u of units) {
    if (u.hp<=0) continue;
    const [enemy, dist] = nearestEnemy(u);
    const reach = u.archer && !u.champ ? 999 : (u.r + (enemy?enemy.r:0) + 6);
    if (u.archer && !u.champ) {
      // лучник: держится у своей стороны, стреляет
      const home = u.bull ? W*0.22 : W*0.78;
      if (Math.abs(u.x-home)>4) u.x += Math.sign(home-u.x)*u.spd;
      if (enemy && --u.cd<=0) { shoot(u, enemy); u.cd = 70+Math.random()*40; }
    } else if (enemy) {
      if (dist > reach) u.x += Math.sign(enemy.x-u.x) * u.spd * (u.champ?1.3:1);
      else if (--u.cd<=0) { enemy.hp -= u.champ?3:1; u.cd = 22; hit(enemy.x, enemy.y, enemy.hp<=0); if (enemy.hp<=0) kills[u.side]++; }
    } else {
      // врагов нет — идём вперёд
      u.x += (u.bull?1:-1)*u.spd*.6;
      u.x = Math.max(30, Math.min(W-30, u.x));
    }
    u.phase += .2;
    drawUnit(u, enemy);
  }
  units = units.filter(u => u.hp > 0);

  // стрелы
  for (const a of arrows) { a.x+=a.vx; a.y+=a.vy; a.vy+=.08; a.life--; if (a.tgt && a.tgt.hp>0 && Math.hypot(a.tgt.x-a.x,a.tgt.y-a.y)<10){ a.tgt.hp--; hit(a.tgt.x,a.tgt.y,a.tgt.hp<=0); if(a.tgt.hp<=0)kills[a.by]++; a.life=0; } drawArrow(a); }
  arrows = arrows.filter(a => a.life>0 && a.y<GROUND+10);

  // вспышки попаданий/надписи
  for (const f of flashes) { f.life--; if (f.txt){ ctx.globalAlpha=Math.min(1,f.life/30); ctx.fillStyle=f.c; ctx.font="bold 20px system-ui"; ctx.textAlign="center"; ctx.fillText(f.txt,f.x,f.y - (90-f.life)*.3); ctx.globalAlpha=1; }
    else { ctx.globalAlpha=f.life/12; ctx.fillStyle=f.c; ctx.beginPath(); ctx.arc(f.x,f.y,(12-f.life)*1.6,0,7); ctx.fill(); ctx.globalAlpha=1; } }
  flashes = flashes.filter(f => f.life>0);

  $("bc").textContent = kills.bull; $("rc").textContent = kills.bear;
  requestAnimationFrame(step);
}

function shoot(u, e) {
  const dx = e.x-u.x, t = 26 + Math.abs(dx)/8;
  arrows.push({ x:u.x, y:u.y-10, vx:dx/t, vy:-(GROUND-u.y)/t - 2, life:120, tgt:e, by:u.side, bull:u.bull });
}
function hit(x,y,dead){ flashes.push({ x, y, c: dead?"#ffd24d":"#ffffff", life: dead?12:7 }); }

function drawCastle(bull) {
  const x = bull ? 0 : W, dir = bull?1:-1, col = bull?"#1f6f55":"#7a2f3e", wall = bull?"#2a8a6a":"#9a3a4c";
  ctx.fillStyle = col;
  ctx.fillRect(bull?0:W-46, GROUND-150, 46, 150); // башня
  ctx.fillStyle = wall;
  ctx.fillRect(bull?46:W-54, GROUND-70, 8, 70); // стена-грань
  // зубцы
  ctx.fillStyle = col;
  for (let i=0;i<4;i++){ const bx = bull? i*12 : W-46+i*12; ctx.fillRect(bx, GROUND-162, 8, 12); }
  // флаг
  ctx.strokeStyle="#cfd8e6"; ctx.beginPath(); ctx.moveTo(bull?23:W-23,GROUND-162); ctx.lineTo(bull?23:W-23,GROUND-185); ctx.stroke();
  const fx = bull ? 23 : W-23;
  ctx.fillStyle = bull?"#2ee6a6":"#ff5c7a"; ctx.beginPath();
  ctx.moveTo(fx,GROUND-185); ctx.lineTo(fx+dir*16,GROUND-179); ctx.lineTo(fx,GROUND-173); ctx.fill();
}

function drawUnit(u, enemy) {
  const s = u.r, col = u.bull?"#2ee6a6":"#ff5c7a", dark = u.bull?"#14b07f":"#d93a5a";
  const face = enemy ? Math.sign(enemy.x-u.x) : (u.bull?1:-1);
  ctx.save(); ctx.translate(u.x, u.y);
  // тень
  ctx.fillStyle="rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(0, 2, s*.9, s*.3, 0, 0, 7); ctx.fill();
  // тело
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, -s, s*.78, 0, 7); ctx.fill();
  ctx.fillRect(-s*.55, -s, s*1.1, s); // туловище
  // ноги (шагают)
  const sw = Math.sin(u.phase)*s*.3;
  ctx.strokeStyle=dark; ctx.lineWidth=Math.max(2,s*.22); ctx.beginPath();
  ctx.moveTo(-s*.25,0); ctx.lineTo(-s*.25+sw,s*.5); ctx.moveTo(s*.25,0); ctx.lineTo(s*.25-sw,s*.5); ctx.stroke();
  // оружие
  ctx.strokeStyle="#dfe7f2"; ctx.lineWidth=Math.max(2,s*.18);
  if (u.archer && !u.champ) { // лук
    ctx.beginPath(); ctx.arc(face*s*.6, -s*1.1, s*.6, -1, 1); ctx.stroke();
  } else { // меч
    ctx.beginPath(); ctx.moveTo(face*s*.5, -s*1.1); ctx.lineTo(face*s*1.4, -s*1.6 - Math.abs(sw)); ctx.stroke();
  }
  // корона богатыря
  if (u.champ) { ctx.fillStyle="#ffd24d"; ctx.beginPath(); ctx.moveTo(-s*.6,-s*1.7); ctx.lineTo(-s*.6,-s*2.1); ctx.lineTo(-s*.2,-s*1.85); ctx.lineTo(0,-s*2.2); ctx.lineTo(s*.2,-s*1.85); ctx.lineTo(s*.6,-s*2.1); ctx.lineTo(s*.6,-s*1.7); ctx.fill(); }
  // полоска hp для сильных
  if (u.max>1) { ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(-s,-s*2.0,2*s,3); ctx.fillStyle=col; ctx.fillRect(-s,-s*2.0,2*s*(u.hp/u.max),3); }
  ctx.restore();
}
function drawArrow(a){ ctx.strokeStyle="#e8d9a0"; ctx.lineWidth=2; const len=8, m=Math.hypot(a.vx,a.vy)||1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(a.x-a.vx/m*len,a.y-a.vy/m*len); ctx.stroke(); }

$("symbol").onchange = connect;
$("big").onchange = ()=>{};
connect(); step();
</script>
</body>
</html>
